aid: blocks
name: Blocks
description: >-
  Blocks is a cloud cost-optimization service that guarantees up to 20% savings
  on AWS spend by aggregating the purchasing power of hundreds of companies into
  group-buying negotiations, then layering automated cloud management on top. Its
  AI-powered DevOps agent, Major Tom, continuously monitors connected AWS accounts
  through read-only billing access, surfaces cost-saving and security findings in
  Slack, and can propose Terraform fixes without requiring root or code access.
  Onboarding is a one-click read-only AWS cost-data integration with no long-term
  contracts and no infrastructure changes. Blocks is backed by Speedinvest and is
  profiled in the API Evangelist network; it currently exposes a marketing and
  product surface rather than a public developer API.
